        /* ==========================================================================
           NOTIFICATION SYSTEM LOGIC
           ========================================================================== */
        function checkNotifications() {
            const alerts = [];
            const todayStr = getLocalDateString();
            const todayTime = new Date(todayStr).getTime();

            // Check Tasks
            appData.tasks.forEach(task => {
                if(task.Status === 'Completed' || !task['Due Date'] || !task.Reminder || task.Reminder === 'None') return;
                
                const dueDate = new Date(task['Due Date']);
                const dueTime = dueDate.getTime();
                let triggerDate = new Date(dueDate);

                if(task.Reminder === '1 Day') triggerDate.setDate(triggerDate.getDate() - 1);
                if(task.Reminder === '1 Week') triggerDate.setDate(triggerDate.getDate() - 7);

                if(todayTime >= triggerDate.getTime() && todayTime <= dueTime) {
                    alerts.push({
                        title: task['Task Name'],
                        date: task['Due Date'],
                        type: 'Task Due',
                        icon: 'ph-check-square-offset',
                        color: 'text-blue-600 bg-blue-100'
                    });
                } else if (todayTime > dueTime) {
                    alerts.push({
                        title: task['Task Name'],
                        date: task['Due Date'],
                        type: 'Overdue Task',
                        icon: 'ph-warning-circle',
                        color: 'text-red-600 bg-red-100'
                    });
                }
            });

            // Check Events (Scanning the next 45 days for recurring matches)
            const checkEnd = new Date();
            checkEnd.setDate(checkEnd.getDate() + 45);
            
            appData.events.forEach(e => {
                if (!e.Date || !e.Reminder || e.Reminder === 'None') return;
                const [ey, em, ed] = e.Date.split('-').map(Number);
                const eventStartDate = new Date(ey, em - 1, ed);

                // Check every day from today until 45 days from now
                let scanDate = new Date(todayStr);
                while(scanDate <= checkEnd) {
                    const sY = scanDate.getFullYear();
                    const sM = scanDate.getMonth();
                    const sD = scanDate.getDate();

                    let occurs = false;
                    if (scanDate >= eventStartDate) {
                        if (!e.Repeat || e.Repeat === 'Never') {
                            occurs = (sY === ey && sM === em - 1 && sD === ed);
                        } else if (e.Repeat === 'Daily') {
                            occurs = true;
                        } else if (e.Repeat === 'Monthly') {
                            if (sD === ed) occurs = true;
                        } else if (e.Repeat === 'Yearly') {
                            if (sM === em - 1 && sD === ed) occurs = true;
                        }
                    }

                    if(occurs) {
                        let triggerDate = new Date(scanDate);
                        if(e.Reminder === '1 Day') triggerDate.setDate(triggerDate.getDate() - 1);
                        if(e.Reminder === '1 Week') triggerDate.setDate(triggerDate.getDate() - 7);
                        if(e.Reminder === '1 Month') triggerDate.setMonth(triggerDate.getMonth() - 1);

                        // If today is on or after the trigger date, but BEFORE the event date
                        if(todayTime >= triggerDate.getTime() && todayTime <= scanDate.getTime()) {
                            let icon = 'ph-calendar-star'; let color = 'text-purple-600 bg-purple-100';
                            if(e.Type === 'Birthday') { icon = 'ph-cake'; color = 'text-rose-600 bg-rose-100'; }
                            if(e.Type === 'Anniversary') { icon = 'ph-heart'; color = 'text-pink-600 bg-pink-100'; }
                            
                            const displayStr = `${sY}-${String(sM+1).padStart(2,'0')}-${String(sD).padStart(2,'0')}`;

                            // Check to avoid duplicate alerts for daily repeats
                            const isDuplicate = alerts.some(a => a.title === e.Title && a.date === displayStr);
                            
                            if(!isDuplicate) {
                                alerts.push({
                                    title: e.Title,
                                    date: displayStr,
                                    type: `Upcoming ${e.Type}`,
                                    icon: icon,
                                    color: color
                                });
                            }
                        }
                    }
                    scanDate.setDate(scanDate.getDate() + 1);
                }
            });

            // Update UI
            const desktopBadge = document.getElementById('desktop-bell-badge');
            const mobileBadge = document.getElementById('mobile-bell-badge');
            const listEl = document.getElementById('notifications-list');
            listEl.innerHTML = '';

            if(alerts.length > 0) {
                desktopBadge.textContent = alerts.length;
                desktopBadge.classList.remove('hidden');
                mobileBadge.classList.remove('hidden');
                
                alerts.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(a => {
                    const niceDate = new Date(a.date).toLocaleString('default', { month: 'short', day: 'numeric', year: 'numeric' });
                    listEl.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-start gap-3">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 ${a.color}">
                                <i class="ph ${a.icon} text-xl"></i>
                            </div>
                            <div>
                                <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-0.5">${a.type}</p>
                                <h4 class="font-bold text-slate-800 text-sm leading-tight">${a.title}</h4>
                                <p class="text-xs font-medium text-slate-500 mt-1">Due: ${niceDate}</p>
                            </div>
                        </div>
                    `;
                });
            } else {
                desktopBadge.classList.add('hidden');
                mobileBadge.classList.add('hidden');
                listEl.innerHTML = `<div class="p-8 text-center text-slate-400 font-medium">No upcoming alerts right now! 🎉</div>`;
            }
        }

            let commitMsg = '';

            if(editId) {

                appData.tasks.push(newTask);

                checkNotifications(); // Recalculate alerts

                appData.tasks = backupTasks;

                btn.disabled = false;

                closeModal('add-event-modal');
                showToast(editId ? 'Event updated!' : 'Event added!');
            } catch (error) {
                console.error(error);

        function editEvent(id) {
            const ev = appData.events.find(e => e.ID === id);
            if(!ev) return;
            document.getElementById('event-edit-id').value = ev.ID;
            document.getElementById('event-date').value = ev.Date;
            document.getElementById('event-type').value = ev.Type;
            document.getElementById('event-title').value = ev.Title;
            document.getElementById('event-repeat').value = ev.Repeat || 'Never';
            document.getElementById('event-reminder').value = ev.Reminder || 'None';
            document.getElementById('event-desc').value = ev.Description || '';
            document.getElementById('event-modal-title').textContent = 'Edit Event';
            document.getElementById('btn-save-event').innerHTML = 'Update Event';
            document.getElementById('add-event-modal').classList.remove('hidden');
        }
